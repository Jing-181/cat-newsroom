<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>事项 / 随记 · 隔离回归</title>
  <link rel="stylesheet" href="/styles.css">
  <style>
    body { margin: 0; }
    #fixture { padding: 16px; }
    .fixture-nav { display: flex; gap: 8px; margin-bottom: 16px; }
  </style>
</head>
<body>
  <main id="fixture"></main>
  <script type="module">
    // Only this dedicated, disposable Chrome profile owns the storage below.
    // Do not import main.js, authentication, sync bootstrap or production accounts.
    const { CONFIG } = await import('/lib/config.js');
    if (!localStorage.getItem('quick-record-fixture-initialized')) {
      localStorage.setItem(CONFIG.storageKey, JSON.stringify(Object.fromEntries(CONFIG.modules.map(m => [m.key, []]))));
      localStorage.setItem('quick-record-fixture-initialized', '1');
    }
    const uploads = [];
    const syncCalls = [];
    let user = { id: 'quick-record-fixture-only', is_anonymous: false };
    const syncErrors = [];
    const syncInputs = [];
    let inspectProxy = () => false;
    window.getCurrentUser = () => user;
    window.getSyncStatus = () => 'online';
    // Match production's synchronous clone boundary; never contact a real account.
    window.syncRecord = ({ moduleKey, record }) => {
      syncInputs.push({ moduleKey, title: record.title, isProxy: inspectProxy(record) });
      record.updated_at = new Date().toISOString();
      try { syncCalls.push({ moduleKey, record: structuredClone(record) }); }
      catch (error) { syncErrors.push({ name: error.name, message: error.message, stack: error.stack }); throw error; }
    };
    window.syncDelete = () => {};
    window.syncMetaField = () => {};
    window.markRecordDeleted = () => {};
    window.updateAuthUI = () => {};
    window.uploadCardImage = async (file, options) => {
      uploads.push({ name: file.name, type: file.type, size: file.size, options });
      if (window.fixture.failUpload) throw new Error('fixture upload failed');
      const url = await new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result);
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
      return { url };
    };
    const [{ createApp, ref, computed, isProxy, nextTick, h }, { default: TodoView }, { default: NoteView }, store] = await Promise.all([
      import('vue'),
      import('/modules/todo/TodoView.vue'),
      import('/modules/note/NoteView.vue'),
      import('/lib/store.js'),
    ]);
    const [{ initMobileViewport }, { default: HomeView }, { default: InsightView }] = await Promise.all([
      import('/lib/mobile-viewport.js'), import('/modules/home/HomeView.vue'), import('/modules/insight/InsightView.vue'),
    ]);
    const cleanupMobileViewport = initMobileViewport();
    window.addEventListener('pagehide', cleanupMobileViewport, { once: true });
    window.fetchUserSettings = async () => null;
    window.getSupabaseConfig = () => null;
    window.saveMetaCloud = () => {};
    const views = { todo: TodoView, note: NoteView, home: HomeView, insight: InsightView };
    inspectProxy = isProxy;
    const view = ref('todo');
    window.fixture = { store, uploads, syncCalls, syncErrors, syncInputs, CONFIG, viewportInitialized: true, navigation: [],
      computedIdentityProbe() {
        const run = copy => {
          const revision = ref(0), list = [];
          let runs = 0;
          const records = computed(() => { revision.value; return copy ? list.slice() : list; });
          const groups = computed(() => { runs++; return records.value.filter(Boolean); });
          const before = groups.value.length;
          list.unshift({ title: 'identity probe' }); revision.value++;
          return { before, after: groups.value.length, runs, actual: list.length };
        };
        return { sameReference: run(false), freshReference: run(true) };
      },
      failUpload: false, nextTick,
      setOwner(id, notify = false) { user = id ? { id, is_anonymous: false } : null; if (notify) store.bump(); },
      resetTodo() { store.getData().todo = []; store.save(); store.bump(); },
      async show(key) { view.value = key; await nextTick(); },
    };
    createApp({ setup: () => () => [
      h('nav', { class: 'fixture-nav' }, ['todo', 'note'].map(key =>
        h('button', { class: 'btn ghost', onClick: () => { view.value = key; } }, key === 'todo' ? '事项' : '随记'))),
      h(views[view.value], { onNavigate: key => { fixture.navigation.push(key); } }),
    ] }).mount('#fixture');
    await nextTick();
    window.ready = true;
  </script>
</body>
</html>
