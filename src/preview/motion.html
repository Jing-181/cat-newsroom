<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Q 比例动作候选 · 对照样稿</title><link rel="stylesheet" href="../styles.css">
<script>document.documentElement.dataset.motionTheme = new URLSearchParams(location.search).get('dark') === '1' ? 'dark' : 'light';</script>
<style>
* { box-sizing: border-box; } body { margin: 0; background: var(--page-bg); color: var(--text); font-family: var(--font); }
main { max-width: 1160px; margin: auto; padding: 24px; } h1 { font-size: 28px; } h2 { font-size: 22px; margin-top: 32px; } p { font: 14px/1.7 var(--font-sans); }
.controls { display: flex; flex-wrap: wrap; gap: 12px; margin: 24px 0; }.grid { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 16px; }
article { padding: 16px; min-width: 0; } h3 { margin: 0 0 12px; font-size: 16px; }
.stage { display: grid; place-items: center; min-height: 264px; }.stage svg { display: block; width: 248px; height: 240px; max-width: 100%; }
.compact .stage { min-height: 120px; }.compact .stage svg { width: 99.1px; height: 96px; }
html[data-motion-theme="dark"] body { background: var(--text); color: var(--ink-text); }
html[data-motion-theme="dark"] #preview article.shared-card { background: var(--text); color: var(--ink-text); border-color: var(--ink-line); }
html[data-motion-theme="dark"] .stage { background: var(--text); color: var(--ink-text); }
.caption { color: var(--text-secondary); }
html[data-motion-theme="dark"] .caption { color: var(--ink-text); }
.shared-btn[aria-pressed="true"] { border-color: var(--accent); }.reference { margin-top: 16px; }.status { font: 700 12px var(--font-sans); color: var(--accent); }
.review-mode > h1 { margin: 8px 0; font-size: 24px; }
.review-mode > h1 + p { display: none; }
.review-mode .controls { margin: 8px 0; }
.review-ids { font-size: 11px; overflow-wrap: anywhere; margin: 8px 0; }
.review-scroll { max-width: 100%; overflow-x: auto; margin: 8px 0; }
.review-row { display: grid; grid-template-columns: minmax(170px, 1fr) repeat(3, minmax(112px, 1fr)); gap: 12px; min-width: 560px; padding: 8px 12px; }
.review-label { display: flex; flex-direction: column; gap: 6px; justify-content: center; min-width: 0; }
.review-label h3 { margin: 0; font-size: 14px; }
.review-label code, .review-label small, .review-label a { font: 11px/1.4 var(--font-sans); overflow-wrap: anywhere; }
.review-label a { color: var(--accent); }
.review-frame { display: flex; flex-direction: column; align-items: center; gap: 4px; }
.review-frame span { font: 11px/1.4 var(--font-sans); }
.review-frame svg { display: block; height: 240px; width: 100%; max-width: 294px; }
.review-mode.compact .review-frame svg { height: 96px; width: 118px; max-width: 100%; }
.review-mode:not(.compact) .review-row { min-width: 950px; }
@media(max-width:820px){ main { padding:16px; }.grid { grid-template-columns:1fr; }}
</style></head>
<body><main class="newsroom-components" id="preview"><span class="status">新版已接入训练与图鉴 · 视觉待验收</span><h1>练哪里，就让哪里更 Q</h1><p>扁平火柴人：圆头与细线四肢。深蹲强调腿的比例、上身收一些；卧推强调手臂比例、下肢收一些。比例在求解前固定，动作中不拉伸。引体保持原样，作为参照。</p>
<div class="controls"><button class="shared-btn" id="size" aria-pressed="false">切换真实 96px</button><button class="shared-btn" id="speed" aria-pressed="false">慢放 0.35×</button><button class="shared-btn" id="dark" aria-pressed="false">深墨底</button></div>
<p id="size-note" aria-live="polite">当前：大图 240px 高。每个动作默认三静帧，点击对应播放按钮才播放候选与原版。</p><div id="grid"></div>
<p>这些是造型与接触关系的绘图样稿，不是训练处方。骨长、握点和肘方向有工程测试；可爱程度、遮挡和 96px 可读性仍需你判断。减少动态效果开启时不播放。</p></main>
<script type="module" src="./motion-preview.js"></script></body></html>
