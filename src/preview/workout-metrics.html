<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>运动指标隔离回归</title></head>
<body><main class="workout-app"><h1>运动指标隔离回归</h1><pre id="diagnostics" aria-live="polite"></pre><p>仅内存合成数据，无账号、同步和本地存储。表单复用实际 setRowActive；事件为测试适配器，不代表完整 WorkoutUI 交互验收。</p><label>场景 <select id="scenario"><option value="run">跑步旧记录无设置</option><option value="segment">跑步机恒定记录段／下坡</option><option value="settings">跑步机仅设置（保存剔除）</option><option value="stairs">爬楼新指标</option><option value="legacy">爬楼旧距离＋未知字段</option><option value="zero">显式零＋采用上次</option><option value="swim">游泳米输入／km持久化</option><option value="rope">跳绳仅次数</option></select></label><button id="reset" type="button">重置合成数据</button><button id="previous" type="button">仅补未填字段</button><button id="save" type="button">保存并从内存 JSON 重读</button><button id="draft" type="button">草稿 JSON 往返</button><section id="form"></section><p id="message" role="status"></p><h2>当前指标摘要</h2><p id="summary"></p><h2>内存数据（输入时更新，表单节点不替换）</h2><pre id="data"></pre><h2>保存结果</h2><pre id="saved"></pre></main><script type="module" src="./workout-metrics-preview.js"></script></body></html>
